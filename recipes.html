<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recipe Details</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Header -->
    <header class="header">
        <div class="container">
            <nav class="navbar">
                <a href="index.html" class="logo">Recipe Explorer</a>

                <ul class="nav-links">
                    <li><a href="index.html">Home</a></li>
                    <li><a href="recipes.html" class="btn-recipe">Recipes</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <!-- Recipes Section -->
    <section id="recipes" class="recipes">
        <div class="container">
            <header class="section-header">
                <h2>Popular Recipes</h2>
                <p>Click any recipe to view complete instructions.</p>
            </header>
            
            <!-- Search Bar-->
            <div class="search-bar">
                <form id="searchForm" class="search-form">
                    <input type="search" id="searchInput" name="q" placeholder="Search recipes by name..">
                    <button type="submit" class="btn-search">Search</button>
                </form>
                <p id="searchMessage" class="search-message"></p>
            </div>

            <div id="recipeContainer" class="recipe-grid"></div>
            <div id="pagination" class="pagination"></div>
        </div>
    </section>
    <!-- Recipes Section Ends-->
    
    <script src="script.js"></script>
</body>
</html>
